<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goldgrab Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a violet game board edge to edge; chunky white cards stacked on it, play screens centred like a handheld */
:root{
  --board:#4a2a8a; --board-deep:#2b1559; --board-hi:#6b3fc4;
  --card:#ffffff; --ink:#23123f; --muted:#6c6190; --line:#e6def6; --soft:#f4f0fb;
  --gold:#ffc93c; --gold-deep:#d39500; --pink:#ff5d8f; --good:#1fbf68; --bad:#ec4154;
  --a1:#e8455a; --a2:#2f7fe8; --a3:#f0a20f; --a4:#20a35d; --a5:#8b4fd6; --a6:#129db2;
  --f-display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:700;
  background-color:var(--board);
  background-image:radial-gradient(circle at 28px 28px, rgba(255,255,255,.07) 7px, transparent 8px),
    linear-gradient(180deg,var(--board-hi) 0%,var(--board) 45%,var(--board-deep) 100%);
  background-size:64px 64px,100% 100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board-deep)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
#app{min-height:100vh}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:rgba(18,6,44,.38);color:#fff;position:relative;z-index:2}
.logo{font-family:var(--f-display);font-size:28px;color:var(--gold);text-shadow:0 3px 0 var(--gold-deep),0 6px 0 rgba(0,0,0,.25);line-height:1.1;background:none;border:0;padding:0;cursor:pointer}
.tb-title{font-family:var(--f-display);font-size:18px;opacity:.9;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrap{max-width:1140px;margin:0 auto;padding-block:24px 48px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}

/* ---------- buttons & inputs ---------- */
.btn{font-family:var(--f-display);font-size:18px;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;color:#fff;background:var(--a2);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.24);display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px;transition:transform .08s,filter .15s;line-height:1.1;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.24)}
.btn:focus-visible,.tile:focus-visible,.chest:focus-visible,.trow:focus-visible,.avpick:focus-visible,.qli:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--a5)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.pink{background:var(--pink)}
.btn.green{background:var(--good)}
.btn.red{background:var(--bad)}
.btn.purple{background:var(--a5)}
.btn.white{background:#fff;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.15);box-shadow:none}
.btn.soft{background:var(--soft);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.btn.sm{font-size:15px;padding:8px 13px;border-radius:10px}
.btn.big{font-size:24px;padding:15px 30px;border-radius:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.armed{background:var(--bad)!important;color:#fff!important}
.in{width:100%;font-family:var(--f-body);font-weight:800;font-size:18px;padding:12px 14px;border:3px solid var(--line);border-radius:12px;color:var(--ink);background:#fff}
.in:focus{outline:none;border-color:var(--a5)}
textarea.in{resize:vertical;line-height:1.4}
select.in{cursor:pointer}
label.fld{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
label.fld .in{text-transform:none;letter-spacing:0;font-size:16px}
.card{background:var(--card);border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.18);padding:20px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{color:#fff;font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.card .sec-head h2,.card h2{color:var(--ink);text-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip.warn{background:#fff1d6;color:#9a5b00}
.chip.ok{background:#dcf7e8;color:#137a43}

/* ---------- toasts & modal ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:center;animation:pop .25s ease-out;transition:opacity .3s,transform .3s}
.toast.bad{background:var(--bad)} .toast.good{background:var(--good)} .toast.gold{background:var(--gold);color:var(--ink)}
.toast.out{opacity:0;transform:translateY(8px)}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px var(--gutter-r) 20px var(--gutter-l);background:rgba(20,8,48,.6);overflow:auto}
#modal .card{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;gap:14px}
#modal h2{font-size:26px}
#modal h3{font-size:18px;margin-top:6px}
#modal code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:var(--soft);border:0;border-radius:10px;width:38px;height:38px;font-size:22px;cursor:pointer;color:var(--ink);flex:none}
.helpgrid{display:grid;gap:12px}
.helpgrid section{background:var(--soft);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.csvwrap{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
.csvwrap table{border-collapse:collapse;font-size:13px;white-space:nowrap;width:100%}
.csvwrap th,.csvwrap td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.csvwrap th{background:var(--soft);font-weight:900}
.csvwrap tr:last-child td{border-bottom:0}
.csvrules{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px;line-height:1.5}
label.btn{cursor:pointer}
.helpgrid ol{margin:4px 0 0;padding-left:20px;line-height:1.55;font-weight:700}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;margin:12px 0 44px}
.hero h1{color:#fff;font-size:clamp(34px,5.4vw,58px);line-height:1.04;text-shadow:0 4px 0 rgba(0,0,0,.22)}
.hero h1 span{color:var(--gold);display:block}
.hero p{color:#e6dcff;font-size:18px;max-width:52ch;margin-top:14px}
.joincard{display:grid;gap:12px;padding:24px}
.joincard h2{font-size:26px;text-align:center}
.pinin{text-align:center;font-family:var(--f-display);font-size:30px;letter-spacing:.12em;font-weight:400}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.qcardx{padding:0;overflow:hidden;display:flex;flex-direction:column}
.qcardx .band{height:84px;display:flex;align-items:flex-end;padding:12px 16px;position:relative;overflow:hidden}
.qcardx .band .bav{position:absolute;right:-6px;bottom:-14px;width:96px;height:96px;opacity:.95}
.qcardx .band .count{font-family:var(--f-display);color:#fff;font-size:15px;background:rgba(0,0,0,.22);padding:4px 10px;border-radius:999px;position:relative}
.qcardx .body{padding:14px 16px 16px;display:grid;gap:10px;flex:1}
.qcardx h3{font-size:21px;overflow-wrap:anywhere}
.qcardx .desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qcardx .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.empty{color:#fff;text-align:center;padding:40px 16px;border:3px dashed rgba(255,255,255,.3);border-radius:18px}
.note{margin-top:36px;background:rgba(18,6,44,.35);color:#e6dcff;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;font-size:15px}
.note b{color:#fff}
.note .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--gold);margin-top:6px;box-shadow:0 0 0 4px rgba(255,201,60,.25)}

/* ---------- editor ---------- */
.titleIn{flex:1 1 200px;min-width:0;background:rgba(255,255,255,.14);border:2px solid transparent;color:#fff;font-family:var(--f-display);font-size:20px;padding:8px 12px;border-radius:10px}
.titleIn:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.2)}
.titleIn::placeholder{color:rgba(255,255,255,.6)}
.editor{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:18px;max-width:1300px;margin:0 auto;padding-block:20px 48px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);align-items:start}
.qlist{display:grid;gap:8px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.qlist .lhead{display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:var(--f-display);font-size:16px;padding:0 4px}
.qlist .items{display:grid;gap:8px;max-height:calc(100vh - 220px);overflow:auto;padding:2px 4px 4px}
.qli{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;background:rgba(255,255,255,.92);border:3px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15);position:relative}
.qli.on{border-color:var(--gold);background:#fff}
.qli .n{font-family:var(--f-display);font-size:18px;grid-row:span 2;color:var(--a5);min-width:22px}
.qli .tl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}
.qli .qsnip{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.qli .wdot{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:#ffa31a;box-shadow:0 0 0 3px #fff1d6}
.qli .wdot[hidden]{display:none}
.addq{display:grid;gap:6px;background:rgba(18,6,44,.3);border-radius:14px;padding:10px}
.addq .lbl{color:#e6dcff;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.addq .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.addq .btn{font-size:14px;padding:8px 6px}
.qmain .card{display:grid;gap:16px}
.qtw{position:relative}
.qtw textarea{font-family:var(--f-display);font-weight:400;font-size:24px;text-align:center;padding:18px 18px 26px;min-height:96px;resize:none}
.cnt{position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--muted);font-weight:900;font-variant-numeric:tabular-nums}
.imgzone{display:grid;place-items:center;min-height:150px;border:3px dashed var(--line);border-radius:14px;background:var(--soft);position:relative;overflow:hidden}
.imgzone img{max-height:240px;width:auto;border-radius:10px;display:block}
.imgzone .rmimg{position:absolute;top:10px;right:10px}
.imgdrop{display:grid;place-items:center;gap:6px;cursor:pointer;color:var(--muted);padding:20px;text-align:center;width:100%;height:100%}
.imgdrop b{color:var(--a5);font-size:17px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{display:flex;align-items:center;gap:8px;background:var(--c);border-radius:14px;padding:10px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);position:relative;min-width:0}
.ans input{flex:1;min-width:0;background:rgba(255,255,255,.18);border:2px solid transparent;border-radius:10px;padding:12px 10px;color:#fff;font-weight:800;font-size:17px}
.ans input::placeholder{color:rgba(255,255,255,.75)}
.ans input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.26)}
.ans .cn{position:absolute;right:62px;bottom:2px;font-size:10px;color:rgba(255,255,255,.8);font-weight:900}
.okbtn{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:transparent;color:transparent;cursor:pointer;font-size:22px;font-weight:900;display:grid;place-items:center}
.okbtn.on{background:#fff;color:var(--good)}
.rmans{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.addans{border:3px dashed var(--line);background:transparent;border-radius:14px;color:var(--muted);font-weight:900;cursor:pointer;min-height:64px}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfbtn{border:0;border-radius:14px;padding:22px;font-family:var(--f-display);font-size:24px;color:#fff;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:12px}
.tfbtn .okbtn{pointer-events:none}
.acclist,.pzlist{display:grid;gap:10px}
.accrow,.pzrow{display:flex;gap:8px;align-items:center}
.pzrow .num{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);color:#fff;background:var(--c)}
.pzrow .in,.accrow .in{flex:1;min-width:0}
.mini{border:0;background:var(--soft);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;font-weight:900;color:var(--ink);flex:none}
.mini:disabled{opacity:.35;cursor:default}
.ehint{font-size:14px;color:var(--muted)}
.qwarn{display:flex;align-items:center;gap:8px;background:#fff1d6;color:#8a5100;padding:10px 14px;border-radius:12px;font-size:14px}
.qwarn[hidden]{display:none}
.qside .card{display:grid;gap:14px}
.qside .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lim{font-size:13px;color:var(--muted);line-height:1.5;border-top:2px solid var(--soft);padding-top:12px}

/* ---------- host setup ---------- */
.setup{max-width:860px;margin:0 auto;display:grid;gap:18px}
.modecard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#ffcf4a,#ffb01f);color:var(--ink)}
.modecard .art{width:110px;height:92px}
.modecard h2{font-size:30px}
.modecard p{font-size:15px;margin-top:4px;max-width:60ch}
.modecard .rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.modecard .rules span{background:rgba(255,255,255,.55);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:10px;background:transparent;cursor:pointer;font-weight:900;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.toggles{display:grid;gap:10px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:var(--soft);border-radius:12px;cursor:pointer}
.tog span{display:grid;gap:2px}
.tog small{color:var(--muted);font-weight:700;font-size:13px}
.tog input{appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:#cfc5e6;position:relative;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tog input:checked{background:var(--good)}
.tog input:checked::after{transform:translateX(20px)}
.tog input:focus-visible{outline:3px solid var(--a5);outline-offset:2px}
.startrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.startrow .muted{color:#e6dcff;margin-right:auto;font-size:14px}

/* ---------- lobby ---------- */
.lobby{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.joinpanel{display:grid;gap:12px;justify-items:center;text-align:center}
.joinpanel .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}
.joinpanel .url{font-size:14px;word-break:break-all;color:var(--a5);font-weight:900;max-width:100%}
.pin{font-family:var(--f-display);font-size:58px;letter-spacing:.06em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.pin.sm{font-size:30px}
.qrbox{background:#fff;padding:10px;border-radius:14px;border:4px solid var(--soft);cursor:zoom-in;line-height:0}
.qrbox img,.qrbox canvas{display:block;max-width:100%;height:auto}
.lmain{display:grid;gap:16px}
.lhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pcount{display:flex;align-items:center;gap:10px;background:rgba(18,6,44,.35);color:#fff;border-radius:14px;padding:10px 16px;font-family:var(--f-display);font-size:22px}
.pcount b{font-weight:400;color:var(--gold);font-size:30px;font-variant-numeric:tabular-nums}
.lhead .grow{flex:1}
.lplayers{display:flex;flex-wrap:wrap;gap:12px;min-height:180px;align-content:flex-start}
.pchip{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:0;border-radius:16px;padding:10px 12px 8px;width:112px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);animation:joinpop .45s cubic-bezier(.2,1.6,.4,1) both;color:var(--ink);position:relative}
.pchip .av{width:64px;height:64px}
.pchip .nm{font-weight:900;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .bt{position:absolute;top:6px;left:6px;font-size:10px;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 5px;font-weight:900}
.pchip.armed{background:var(--bad);color:#fff}
.pchip.armed .nm::after{content:" · remove?"}
.waitmsg{color:#e6dcff;width:100%;text-align:center;padding:40px 10px;border:3px dashed rgba(255,255,255,.25);border-radius:18px;display:grid;gap:10px;place-items:center}
.waitmsg .dots{display:flex;gap:6px}
.waitmsg .dots i{width:12px;height:12px;border-radius:50%;background:var(--gold);animation:bob 1s infinite}
.waitmsg .dots i:nth-child(2){animation-delay:.15s}.waitmsg .dots i:nth-child(3){animation-delay:.3s}

/* ---------- host game ---------- */
.hclock{font-family:var(--f-display);font-size:24px;color:#fff;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 14px;font-variant-numeric:tabular-nums}
.hgame{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.hside{display:grid;gap:16px}
.hside h3{font-size:18px;margin-bottom:10px}
.board{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:36px 54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 14px 8px 10px;transition:transform .3s}
.brow.r1{background:#fff6d8}
.brow.off{opacity:.5}
.brow .rank{font-family:var(--f-display);font-size:22px;text-align:center;color:var(--muted)}
.brow.r1 .rank{color:var(--gold-deep)}
.brow .bav{width:54px;height:54px}
.brow .bname{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bname em{font-style:normal;font-size:11px;background:#fff;border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:2px}
.bar{height:12px;background:#e2d9f3;border-radius:999px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffdf7a);border-radius:999px;transition:width .5s ease}
.bgold{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
(() => {
'use strict';

/* ============================================================
   Config
   ============================================================ */
const ARTIFACT_URL = 'https://claude.ai/artifact/RCZDHDyRpk11ANp6QYWES9';            // claude.ai link of this page, used for the QR code when hosted inside Claude
const IN_ARTIFACT = !!(window.claude && typeof window.claude.use === 'function');
const LIMITS = { questions: 100, q: 120, a: 75, typeA: 20, pz: 20, minAns: 2, maxAns: 6, accepted: 4, pzMax: 4, players: 150 };
const TIMES = [5, 10, 20, 30, 45, 60, 90, 120, 180, 240, 0];
const TYPES = { quiz: 'Quiz', tf: 'True or false', type: 'Type answer', puzzle: 'Puzzle' };
const COLORS = ['var(--a1)', 'var(--a2)', 'var(--a3)', 'var(--a4)', 'var(--a5)', 'var(--a6)'];

/* ============================================================
   Helpers
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const modal = $('#modal');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n || 0).toLocaleString('en-US');
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const pinFmt = p => String(p).replace(/(\d{3})(\d{3})/, '$1 $2');
const timeLabel = t => t === 0 ? 'No limit' : t < 60 ? `${t} seconds` : `${t / 60} minute${t === 60 ? '' : 's'}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const sget = (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const sset = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };

function toast(text, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = text;
  $('#toasts').appendChild(el);
  const ms = 2700 + Math.min(6000, text.length * 35);
  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => el.remove(), ms + 400);
}
function copyText(text, fallbackEl) {
  const fb = () => { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); toast('Selected. Press Ctrl+C or ⌘C to copy.'); } else toast('Copy didn’t work here', 'bad'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied', 'good'), fb); } catch (e) { fb(); }
}
function openModal(html) { modal.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`; modal.hidden = false; }
function closeModal() { modal.hidden = true; modal.innerHTML = ''; }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function arm(b, label, fn) {
  if (b.dataset.armed) { fn(); return; }
  const old = b.innerHTML; b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = label;
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.classList.remove('armed'); b.innerHTML = old; } }, 3000);
}

/* ---------- sound ---------- */
let AC = null, muted = store.get('gg_muted', false);
function tone(f, d = .12, type = 'sine', v = .07, delay = 0) {
  if (muted) return;

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}
const sfx = {
  ok() { tone(660, .1, 'triangle'); tone(880, .18, 'triangle', .07, .1); },
  bad() { tone(240, .16, 'sawtooth', .04); tone(180, .26, 'sawtooth', .04, .14); },
  chest() { tone(523, .07, 'square', .035); tone(659, .07, 'square', .035, .07); tone(988, .16, 'square', .035, .14); },

    case 'mult': { const a = p.gold * (c.x - 1); p.gold += a; text = `${c.x === 3 ? 'Tripled' : 'Doubled'} your gold: +${fmt(a)}`; if (a) feedTxt = `${p.name} ${c.x === 3 ? 'tripled' : 'doubled'} their gold to ${fmt(p.gold)}`; break; }
    case 'lose': { const a = Math.floor(p.gold * c.p / 100); p.gold -= a; text = `Lost ${c.p}% of your gold: −${fmt(a)}`; break; }
    case 'steal': {
      if (!t || t === p || t.gold <= 0) { text = 'Nobody had any gold to steal'; break; }
      const a = Math.max(1, Math.floor(t.gold * c.p / 100)); t.gold -= a; p.gold += a;
      text = `You stole ${fmt(a)} gold from ${t.name}`; feedTxt = `${p.name} stole ${fmt(a)} gold from ${t.name}`; feedKind = 'steal';
      hit = { t, text: `${p.name} stole ${fmt(a)} of your gold!` }; break;
    }
    case 'swap': {
      if (!t || t === p) { text = 'Nobody to swap with'; break; }
      const mine = p.gold; p.gold = t.gold; t.gold = mine;
      text = `You swapped gold with ${t.name}`; feedTxt = `${p.name} swapped gold with ${t.name} (${fmt(mine)} ↔ ${fmt(p.gold)})`; feedKind = 'swap';
      hit = { t, text: `${p.name} swapped gold with you! You now have ${fmt(t.gold)}.` }; break;
    }
  }
  return { delta: p.gold - before, text, hit, feedTxt, feedKind };
}

const blankAns = () => [{ text: '', ok: false }, { text: '', ok: false }, { text: '', ok: false }, { text: '', ok: false }];

      mkQ({ type: 'tf', text: 'The Great Wall of China is visible from the Moon with the naked eye.', answers: A('True', '*False'), time: 10 }),
      mkQ({ text: 'How many sides does a hexagon have?', answers: A('5', '*6', '7', '8'), time: 10 }),
      mkQ({ text: 'Which is the largest ocean on Earth?', answers: A('Atlantic', 'Indian', '*Pacific', 'Arctic') }),

      mkQ({ text: 'Which of these are programming languages? Pick all that apply.', answers: A('*Python', 'Excel', '*Ruby', 'Photoshop'), select: 'multi', time: 30 }),
      mkQ({ text: 'Who painted the Mona Lisa?', answers: A('Michelangelo', '*Leonardo da Vinci', 'Raphael', 'Donatello') }),
      mkQ({ type: 'puzzle', text: 'Put these in order from smallest to largest.', answers: A('Byte', 'Kilobyte', 'Megabyte', 'Gigabyte'), time: 30 }),
      mkQ({ text: 'What is the square root of 144?', answers: A('10', '*12', '14', '16'), points: 'double' })

function validQ(q) {
  if (!q.text.trim()) return 'Add the question text';
  if (q.type === 'type') return q.accepted.some(s => s.trim()) ? '' : 'Add at least one accepted answer';
  const filled = q.answers.filter(a => a.text.trim());
  if (q.type === 'puzzle') return filled.length >= 2 ? '' : 'Add at least 2 items to put in order';
  if (q.type === 'tf') return q.answers.some(a => a.ok) ? '' : 'Pick True or False as the correct answer';
  if (filled.length < 2) return 'Fill in at least 2 answers';
  if (!filled.some(a => a.ok)) return 'Mark at least one correct answer';
  return '';
}
function playerQuiz(qz, withImages) {
  return qz.questions.filter(q => !validQ(q)).map(q => ({
    type: q.type, text: q.text, img: withImages ? q.img : null, time: q.time, points: q.points, select: q.select,
    answers: q.type === 'type' ? [] : q.answers.filter(a => a.text.trim()).map(a => ({ text: a.text.trim(), ok: !!a.ok })),
    accepted: q.type === 'type' ? q.accepted.map(s => s.trim()).filter(Boolean) : []
  }));
}
function correctText(q) {
  if (q.type === 'type') return q.accepted.join(' / ');
  if (q.type === 'puzzle') return q.answers.map(a => a.text).join(' → ');
  return q.answers.filter(a => a.ok).map(a => a.text).join(', ');
}
function sanitizeQuiz(raw) {
  if (!raw || !Array.isArray(raw.questions)) return null;
  const qs = raw.questions.slice(0, LIMITS.questions).map(q => {
    const type = TYPES[q.type] ? q.type : 'quiz';
    const ans = (Array.isArray(q.answers) ? q.answers : []).slice(0, LIMITS.maxAns).map(a => ({ text: String(a.text || '').slice(0, LIMITS.a), ok: !!a.ok }));
    while (ans.length < 2) ans.push({ text: '', ok: false });
    return mkQ({
      type, text: String(q.text || '').slice(0, LIMITS.q), img: typeof q.img === 'string' && q.img.startsWith('data:image/') ? q.img : null,
      answers: ans, accepted: (Array.isArray(q.accepted) && q.accepted.length ? q.accepted : ['']).slice(0, LIMITS.accepted).map(s => String(s).slice(0, LIMITS.typeA)),
      time: TIMES.includes(q.time) ? q.time : 20, points: ['standard', 'double', 'none'].includes(q.points) ? q.points : 'standard', select: q.select === 'multi' ? 'multi' : 'single'
    });
  });
  if (!qs.length) qs.push(mkQ());
  return { id: uid(), title: String(raw.title || 'Untitled quiz').slice(0, 95), desc: String(raw.desc || '').slice(0, 500), created: Date.now(), questions: qs };
}

function quizCode(qz) { try { return btoa(unescape(encodeURIComponent(JSON.stringify({ title: qz.title, desc: qz.desc, questions: qz.questions })))); } catch (e) { return ''; } }

    if (ans.length === 1) { out.push(mkQ({ type: 'type', text: text.slice(0, LIMITS.q), accepted: [plain[0].slice(0, LIMITS.typeA)] })); continue; }

/* ============================================================

  /* ---------- host ---------- */
  async host(pin, h) {

  /* ---------- player ---------- */

  _peerConnect(pin) {

/* ============================================================
   Host engine
   ============================================================ */
let H = null;
async function startHosting(qz, cfg, local) {
  const qs = playerQuiz(qz, true);
  H = { quiz: qz, qs, cfg, pin: '', players: {}, banned: {}, phase: 'lobby', endsAt: 0, feed: [], qstats: qs.map(() => [0, 0]), local };
  Net.reset();
  Net.mode = local ? 'local' : IN_ARTIFACT ? 'room' : 'peer';
  go('hostConnecting');
  let err = null;
  for (let a = 0; a < 3; a++) {
    H.pin = String(rnd(100000, 999999));
    try { await Net.host(H.pin, { onMsg: hostMsg, onLeave: hostLeave }); err = null; break; }
    catch (e) { err = e; if (!(e && e.type === 'unavailable-id')) break; }
  }
  if (!H) return;
  if (err) { go('hostError', { hostErr: errText(err) }); return; }
  H.imgT = await Promise.all(H.qs.map(q => q.img ? shrinkImg(q.img, 480, .62) : null));
  H.timer = startTicker(hostTick);
  if (local) { for (let i = 0; i < 5; i++) addBot(true); }
  go('lobby');
}

  return new Promise(res => {
    const img = new Image();
    img.onload = () => { try { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); const out = c.toDataURL('image/jpeg', quality); res(out.length < src.length ? out : src); } catch (e) { res(src); } };

}
function stopHosting() { if (H) { if (H.timer) H.timer.stop(); clearTimeout(H._stQ); clearTimeout(H._rf); } Net.reset(); H = null; }
V.hostConnecting = () => { app.innerHTML = `${topbar()}<main class="play center"><div class="waitcard"><div class="spinner"></div><h2 style="color:#fff">Opening the lobby…</h2></div></main>`; };
V.hostError = () => { app.innerHTML = `${topbar()}<main class="play center"><div class="card msgcard"><h2>Couldn’t open the lobby</h2><p>${esc(S.hostErr)}</p><div class="prow"><button class="btn soft" data-act="leaveHost">Back</button><button class="btn gold" data-act="practiseInstead">Practise with bots</button></div></div></main>`; };
ACT.practiseInstead = () => { const qz = H && H.quiz; const cfg = H && H.cfg; stopHosting(); if (qz) startHosting(qz, cfg, true); };

const sorted = () => Object.values(H.players).sort((a, b) => b.gold - a.gold || a.joinedAt - b.joinedAt);

function armSkip() { if ($('#skipLater')) IV.push(setTimeout(() => { const b = $('#skipLater'); if (b) b.hidden = false; }, 6000)); }
ACT.nextQ = () => nextQ();
V.pchest = () => {
  if (!P.chest) P.chest = { phase: 'closed', chosen: -1, views: null };
  const C = P.chest, rev = C.phase === 'revealed';
  const title = C.phase === 'closed' ? 'Choose a chest!' : C.phase === 'opening' ? 'Opening…' : esc(C.views[C.chosen].label);
  app.innerHTML = `${pTop()}<main class="play chestscreen"><h1 class="ctitle">${title}</h1>
    <div class="chests">${[0, 1, 2].map(i => rev
      ? `<div class="chest open ${i === C.chosen ? 'chosen' : 'other'} t-${C.views[i].tone}" style="animation-delay:${i === C.chosen ? 0 : .3}s"><div class="cval">${esc(C.views[i].label)}</div><div class="csub">${esc(C.views[i].sub)}</div></div>`
      : `<button class="chest closed ${C.phase === 'opening' ? (i === C.chosen ? 'opening' : 'dimmed') : ''}" data-act="pickChest" data-i="${i}" style="animation-delay:${i * .2}s" aria-label="Chest ${i + 1}" ${C.phase === 'opening' ? 'disabled' : ''}>${CHEST_SVG}</button>`).join('')}</div>
    ${C.phase === 'closed' ? '<p class="hint">One of these could change everything.</p>' : rev && C.need ? '<p class="hint">Now pick your target…</p>' : C.phase === 'opening' ? skipLater() : ''}</main>`;
  armSkip();
  if (!IV.length) pClock();
};
ACT.pickChest = b => {
  const C = P.chest; if (!C || C.phase !== 'closed') return;
  C.phase = 'opening'; C.chosen = +b.dataset.i; sfx.chest(); V.pchest();
  request({ t: 'pick', i: C.chosen }, m => {
    if (m.closed || P.chest !== C) return;
    if (!m.chests) { S.res = { delta: m.delta || 0, text: m.text || '', gold: P.gold }; return go('pres'); }
    C.views = m.chests; C.phase = 'revealed';
    if (m.need) { C.need = m; if (S.view === 'pchest') V.pchest(); IV.push(setTimeout(() => { if (P.chest === C) go('ptarget'); }, 1300)); return; }
    S.res = { delta: m.delta || 0, text: m.text || '', gold: P.gold };
    if (S.view === 'pchest') V.pchest();
    IV.push(setTimeout(() => { if (P.chest === C) showResult(); }, 1400));
  });
};
function showResult() { go('pres'); const d = S.res && S.res.delta; if (d > 0) sfx.ok(); else if (d < 0) sfx.bad(); }
V.ptarget = () => {
  const n = P.chest.need, waiting = P.chest.targetSent;
  app.innerHTML = `${pTop()}<main class="play"><div class="card tcard"><h2>${n.steal ? `Steal ${n.pct}% from…` : 'Swap gold with…'}</h2>
    <p class="muted" style="text-align:center">${n.steal ? `You take ${n.pct}% of their gold.` : 'You trade your whole total with them.'} You have ${fmt(P.gold)} gold.</p>
    <div class="tlist">${n.targets.map(o => `<button class="trow" data-act="pickTarget" data-cid="${esc(o[0])}" ${waiting ? 'disabled' : ''}><span class="tav">${avatarSVG(o[2])}</span><span class="tname">${esc(o[1])}</span><span class="tgold"><i class="coin"></i>${fmt(o[3])}</span></button>`).join('')}</div>
    ${waiting ? '<div style="display:grid;place-items:center;gap:10px"><div class="spinner sm dark"></div>' + skipLater('soft') + '</div>' : ''}</div></main>`;
  armSkip();
  if (!IV.length) pClock();
};
ACT.pickTarget = b => {
  const C = P.chest; if (!C || !C.need || C.targetSent) return;
  C.targetSent = true; V.ptarget();
  request({ t: 'target', cid: b.dataset.cid }, m => {
    if (m.closed || P.chest !== C) return;
    S.res = { delta: m.delta || 0, text: m.text || '', gold: P.gold }; showResult();
  });
};
V.pres = () => {
  const r = S.res;
  app.innerHTML = `${pTop()}<main class="play center"><div class="resbox"><div class="delta ${r.delta > 0 ? 'up' : r.delta < 0 ? 'down' : ''}">${r.delta > 0 ? '+' + fmt(r.delta) : r.delta < 0 ? '−' + fmt(-r.delta) : '±0'}</div><p>${esc(r.text)}</p><p class="restotal">You now have <b>${fmt(r.gold)}</b> gold</p><button class="btn gold big" data-act="nextQ">Next question</button></div></main>`;
  pClock();
};
V.pend = () => {
  const f = P.final || { rank: P.rank || 0, n: P.n || 0, gold: P.gold, top: (P.top || []).map(x => [x.cid, x.name, x.av, x.gold]) };
  const rank = f.rank;
  app.innerHTML = `${pTop()}<main class="play center"><div class="waitcard"><div class="bigav">${avatarSVG(P.av)}</div><h1>${rank === 1 ? 'You won!' : 'Game over'}</h1>
    <div class="nm">${rank ? `${ord(rank)} place${f.n ? ' of ' + f.n : ''}` : ''}</div>
    <p style="font-size:20px;color:#fff">You finished with <b style="color:var(--gold)">${fmt(f.gold)} gold</b>.</p>
    <div class="card" style="width:min(420px,100%);text-align:left;margin-top:8px"><div class="rtable">${f.top.map((x, i) => `<div class="rrow" style="grid-template-columns:28px 36px minmax(0,1fr) auto"><span class="rk">${i + 1}</span><span class="rav" style="width:36px;height:36px">${avatarSVG(x[2])}</span><span class="rn">${esc(x[1])}${x[0] === P.cid ? ' (you)' : ''}</span><span class="rg">${fmt(x[3])}</span></div>`).join('')}</div></div>
    <p style="color:#e6dcff;font-size:14px">Stay here if the host starts another round.</p>
    <button class="btn ghost" data-act="pHome">Leave game</button></div></main>`;
  if (rank === 1) confetti();
};

/* ============================================================
   Boot
   ============================================================ */
function route() {
  const m = (location.hash || '').match(/^#join-(\d{6})$/);
  if (m && !(P && P.pin === m[1])) { playerConnect(m[1]); return true; }
  return false;
}
window.addEventListener('hashchange', route);
if (!route()) go('home');
})();
</script>

</body>
</html>
